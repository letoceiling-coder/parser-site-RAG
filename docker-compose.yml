# Parser Site RAG — главный Docker Compose
# Запуск: docker compose up -d
# Профили: --profile monitoring --profile ragflow --profile dify

name: parser-site-rag

networks:
  parser-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  crawl4ai_data:
  scrapy_data:
  certbot_certs:
  certbot_www:

services:
  # ─── Reverse Proxy (опционально, если host nginx не используется) ─
  nginx:
    image: nginx:1.27-alpine
    container_name: parser-nginx
    restart: unless-stopped
    profiles:
      - docker-nginx
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api-gateway
      - crawler-crawl4ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - parser-net

  certbot:
    image: certbot/certbot:latest
    container_name: parser-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - ssl

  # ─── Базы данных ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: parser-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-parser_rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - parser-net

  redis:
    image: redis:7-alpine
    container_name: parser-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - parser-net

  # ─── FastAPI Gateway + OpenRouter ────────────────────────────
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: parser-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-ru-3}
      S3_BUCKET: ${S3_BUCKET:-knowledge-raw}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-parser_rag}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RAGFLOW_URL: http://host.docker.internal:${RAGFLOW_PORT:-9380}
      DIFY_URL: http://host.docker.internal:${DIFY_PORT:-8081}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - parser-net

  # ─── Crawl4AI — JS-сайты ─────────────────────────────────────
  crawler-crawl4ai:
    build:
      context: ./services/crawler-crawl4ai
      dockerfile: Dockerfile
    container_name: parser-crawl4ai
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-ru-3}
      S3_BUCKET: ${S3_BUCKET:-knowledge-raw}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-parser_rag}
      CAPTCHA_SERVICE: ${CAPTCHA_SERVICE:-}
      CAPTCHA_API_KEY: ${CAPTCHA_API_KEY:-}
      PROXY_ENABLED: ${PROXY_ENABLED:-false}
      PROXY_LIST: ${PROXY_LIST:-}
      RAGFLOW_URL: http://host.docker.internal:${RAGFLOW_PORT:-9380}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./configs/sources:/app/configs/sources:ro
      - crawl4ai_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - parser-net

  # ─── Scrapy — статические сайты ──────────────────────────────
  crawler-scrapy:
    build:
      context: ./services/crawler-scrapy
      dockerfile: Dockerfile
    container_name: parser-scrapy
    restart: unless-stopped
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-ru-3}
      S3_BUCKET: ${S3_BUCKET:-knowledge-raw}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-parser_rag}
      PROXY_ENABLED: ${PROXY_ENABLED:-false}
      PROXY_LIST: ${PROXY_LIST:-}
      CAPTCHA_API_KEY: ${CAPTCHA_API_KEY:-}
      RAGFLOW_URL: http://host.docker.internal:${RAGFLOW_PORT:-9380}
    volumes:
      - ./configs/sources:/app/configs/sources:ro
      - scrapy_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - parser-net

  # ─── Findpapers — научные API ────────────────────────────────
  findpapers:
    build:
      context: ./services/findpapers
      dockerfile: Dockerfile
    container_name: parser-findpapers
    restart: unless-stopped
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-ru-3}
      S3_BUCKET: ${S3_BUCKET:-knowledge-raw}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-parser_rag}
      RAGFLOW_URL: http://host.docker.internal:${RAGFLOW_PORT:-9380}
    volumes:
      - ./configs/findpapers:/app/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - parser-net

  # ─── Celery Worker (очередь задач парсинга) ──────────────────
  celery-worker:
    build:
      context: ./services/crawler-crawl4ai
      dockerfile: Dockerfile
    container_name: parser-celery-worker
    restart: unless-stopped
    command: celery -A tasks worker --loglevel=info --concurrency=2
    shm_size: "2gb"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-ru-3}
      S3_BUCKET: ${S3_BUCKET:-knowledge-raw}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-parser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-parser_rag}
      CAPTCHA_SERVICE: ${CAPTCHA_SERVICE:-}
      CAPTCHA_API_KEY: ${CAPTCHA_API_KEY:-}
      PROXY_ENABLED: ${PROXY_ENABLED:-false}
      PROXY_LIST: ${PROXY_LIST:-}
    volumes:
      - ./configs/sources:/app/configs/sources:ro
      - crawl4ai_data:/app/data
    depends_on:
      - redis
      - crawler-crawl4ai
    networks:
      - parser-net

  celery-beat:
    build:
      context: ./services/crawler-crawl4ai
      dockerfile: Dockerfile
    container_name: parser-celery-beat
    restart: unless-stopped
    command: celery -A tasks beat --loglevel=info
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
      - celery-worker
    networks:
      - parser-net

  # ─── Мониторинг ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: parser-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    profiles:
      - monitoring
    networks:
      - parser-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: parser-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN:-siteaacess.ru}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    profiles:
      - monitoring
    networks:
      - parser-net

model: "qwen/qwen3-coder:free"
label:
  en_US: "FREE Qwen3 Coder"
  ru_RU: "FREE Qwen3 Coder"
model_type: llm
features:
  - multi-tool-call
  - agent-thought
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: max_tokens
    use_template: max_tokens
    default: 4096
pricing:
  input: "0.0"
  output: "0.0"
  unit: "0.000001"
  currency: USD

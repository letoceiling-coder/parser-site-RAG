global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "parser-api"
    static_configs:
      - targets: ["api-gateway:8000"]
    metrics_path: /metrics

  - job_name: "parser-crawl4ai"
    static_configs:
      - targets: ["crawler-crawl4ai:8001"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
